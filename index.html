<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouTube Embed</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  iframe {
    width: 100vw;
    height: 56.25vw;  /* rapporto 16:9 */
    max-width: 1920px;
    max-height: 1080px;
    border: 0;
  }
</style>
</head>
<body>

<iframe 
  src="https://www.youtube.com/embed/cXPPFw3yfQM?&autoplay=1"
  title="YouTube video player"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
  referrerpolicy="strict-origin-when-cross-origin"
  allowfullscreen>
</iframe>

</body>
</html>
